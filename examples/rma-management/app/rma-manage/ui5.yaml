# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: rmamanagement.rmamanage
type: application
builder:
  bundles:
    - bundleDefinition:
        name: Component-preload.js
        defaultFileTypes:
          - ".js"
          - ".fragment.xml"
          - ".view.xml"
          - ".properties"
          - ".json"
        sections:
          - mode: preload
            filters:
              - "**"
            resolve: false
  customTasks:
    - name: ui5-task-zipper
      afterTask: generateComponentPreload
      configuration:
        archiveName: rma-manage
        additionalFiles:
          - xs-app.json
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /odata
            url: http://localhost:4004
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
